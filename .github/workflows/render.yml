name: render
on:
  workflow_dispatch:
    inputs:
      assets_url: { required: true }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: curl -L "${{ inputs.assets_url }}" -o job.zip && unzip job.zip -d job
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && cd job && bash render.sh
      - uses: actions/upload-artifact@v4
        with: { name: hasil-render, path: job/output.mp4 }
