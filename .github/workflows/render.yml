name: render
on:
  workflow_dispatch:
    inputs:
      # LEGACY path: URL of a packed job.zip (Muse storage). When set, the
      # workflow behaves exactly as it always has.
      assets_url: { required: false, default: "" }
      # REPO path (main path since 21 Nov 2026): project folder inside this
      # repo, e.g. projects/tuna-40m. Used when assets_url is empty.
      project_path: { required: false, default: "" }
      # Frame window [from_frame, to_frame) on the 75-frame chunk grid.
      # Empty = whole composition (render-chunks.mjs defaults).
      from_frame: { required: false, default: "" }
      to_frame: { required: false, default: "" }
      # Optional git ref to check out for the repo path (default: the ref
      # the workflow was dispatched on).
      ref: { required: false, default: "" }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ---- LEGACY: render a packed job.zip downloaded from assets_url ----
      - name: legacy - download job.zip
        if: ${{ inputs.assets_url != '' }}
        run: curl -L "${{ inputs.assets_url }}" -o job.zip && unzip job.zip -d job
      - name: legacy - render job
        if: ${{ inputs.assets_url != '' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && cd job && bash render.sh
      - name: legacy - upload artifact
        if: ${{ inputs.assets_url != '' }}
        uses: actions/upload-artifact@v4
        with: { name: hasil-render, path: job/output.mp4 }
      # ---- REPO: render a project checked out from this repo ----
      # Same contract as pack_window.py's render.sh: render the window's
      # chunks with scripts/render-chunks.mjs, then pack them into
      # output.mp4 (a ZIP of chunk-*.mp4) as artifact "hasil-render".
      - name: repo - render window from project_path
        if: ${{ inputs.assets_url == '' && inputs.project_path != '' }}
        env:
          FROM: ${{ inputs.from_frame }}
          TO: ${{ inputs.to_frame }}
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd "${{ inputs.project_path }}"
          npm install --no-audit --no-fund
          node -e "import('@remotion/renderer').then((m) => m.ensureBrowser()).then(() => console.log('chrome ready'))"
          node scripts/render-chunks.mjs 75
          cd out/chunks && python3 -c "
          import zipfile, glob
          z = zipfile.ZipFile('../../output.mp4', 'w', zipfile.ZIP_STORED)
          for f in sorted(glob.glob('chunk-*.mp4')):
              z.write(f, f)
          z.close()
          print('packed output.mp4')
          " && cd ../..
          ls -la output.mp4
      - name: repo - upload artifact
        if: ${{ inputs.assets_url == '' && inputs.project_path != '' }}
        uses: actions/upload-artifact@v4
        with: { name: hasil-render, path: "${{ inputs.project_path }}/output.mp4" }
